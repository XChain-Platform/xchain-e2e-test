name: CI

# xchain-e2e-test vendors the canonical coin registry from xchain-hub but had
# no CI workflow, so its copy was never drift-checked. This workflow enforces
# that cross-repo byte-identity, and runs the repo's hermetic unit tier.
#
# Until 2026-07-26 this workflow ran NO tests at all, only the drift guards,
# so hundreds of unit cases never executed on a push and a consensus-adjacent
# integration suite sat red for ten days with nothing to report it. The unit
# tier below closes the larger half of that.
#
# The live tier (test:integration:live) is still not run here, and the reason is
# concrete rather than "needs services": test/helpers/multiValidatorHubHelper.js
# resolves xchain-hub SOURCE at require time and THROWS at module load if it is
# absent, so the sibling checkout below is what makes any of this runnable at
# all. The full `npm run ci` gate additionally needs xchain-documentation,
# xchain-explorer, xchain-indexer, xchain-sdk and xchain-sync as siblings (each
# for a vendored consensus-constant parity check), which is five more deploy-key
# secrets.
#
# SECRETS: two dedicated read-only deploy keys, one per consumer rather than a
# shared pair, each verified by cloning with it directly:
#   XCHAIN_HUB_DEPLOY_KEY       -> xchain-hub, read-only
#   XCHAIN_INDEXER_DEPLOY_KEY   -> xchain-indexer, read-only
# Secrets in this org are per-repo, not org-wide, so neither key is inherited
# from another workflow that references the same name.
# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  # Protected branches (master, develop) group per COMMIT and are never
  # cancelled; everything else groups per ref and supersedes freely.
  #
  # develop is where every lane lands post-adoption, and the release ceremony
  # freezes a release branch at a specific develop SHA and requires that SHA's
  # run to be green. A run cancelled by the next push can never supply that,
  # and GitHub evicts a QUEUED run in the same group regardless of
  # cancel-in-progress, so the grouping is what actually fixes it.
  group: ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.sha || 'ref' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

jobs:
  # The hermetic unit tier. Verified against a pristine clone with exactly this
  # layout (clean checkout + xchain-hub as a sibling + npm ci), exit 0. A
  # handful of cases skip for want of a .env, which CI does not have either,
  # so that is expected rather than a gap opening up.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-e2e-test

      # Sibling, NOT nested: multiValidatorHubHelper tries <repo>/xchain-hub
      # first and the checkout parent second, and the second is what resolves.
      # The canonical repo is private pre-launch, so this uses the same
      # read-only deploy key the drift-guards job already relies on; drop the
      # ssh-key line when the repos flip public at launch.
      - name: Check out xchain-hub (required at require time by the hub helper)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every suite in this repo requires exactly Node 22; 18 and 24 fail, and
      # some of those failures are silent skips rather than errors.
      - name: Install dependencies
        working-directory: xchain-e2e-test
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Unit tier
        working-directory: xchain-e2e-test
        run: npm run test:unit

  # THE LIVE TIER, as `npm run ci:live` -> scripts/run-live-tier.js over the
  # roster in test/integration/live-tier.json. That is the same lane the venue
  # pre-push gate runs, so the two cannot drift apart about what "the live tier"
  # means. A hardcoded single-suite command line is a roster of one that nothing
  # keeps current, which previously let a suite sit red for ten days with no
  # lane anywhere to notice, so the roster is read from the shared JSON file
  # instead.
  #
  # The runner also fails a suite that ran nothing, which matters most here:
  # these suites skip themselves when a service is missing, so a runner without
  # Docker would otherwise report a green tier having proved nothing.
  #
  # It self-provisions a throwaway MariaDB through Docker, which ubuntu-latest
  # supplies, so it needs no service container and no credentials. What it does
  # need is TWO sibling checkouts WITH THEIR DEPENDENCIES INSTALLED, and the
  # second half of that is not obvious: xchain-hub's HubDbBroadcaster requires
  # `ws` OUTSIDE a try/catch, and Node resolves that from the requiring file's
  # own tree, never from xchain-e2e-test/node_modules. A bare checkout therefore
  # dies at module load with "Cannot find module 'ws'". (hub_db_sync's own `ws`
  # require IS optional, which would have degraded silently instead: live updates
  # off, bootstrap still green, the streaming cases failing for a reason nothing
  # in the output names.)
  #
  # Should XCHAIN_INDEXER_DEPLOY_KEY ever go missing this job fails loudly
  # rather than skipping, which is deliberate: a job that skipped itself on a
  # missing dependency would reproduce the exact defect this exists to fix, a
  # suite that reports success while proving nothing.
  #
  # Verified end to end against genuinely bare clones of all three repos plus
  # npm ci in each: 20 suites, 62 passing, 0 failing, ~19 min.
  live-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-e2e-test

      - name: Check out xchain-hub (broadcaster side of the mirror)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Check out xchain-indexer (sync side of the mirror)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-indexer
          ssh-key: ${{ secrets.XCHAIN_INDEXER_DEPLOY_KEY }}
          path: xchain-indexer

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # All three, not just the suite's own repo. See the `ws` note above.
      - name: Install dependencies (all three trees)
        run: |
          for d in xchain-e2e-test xchain-hub xchain-indexer; do
            ( cd "$d" && if [ -f package-lock.json ]; then npm ci; else npm install; fi )
          done

      # HUB_DB_* is unset on purpose: with those present the fixture reuses a
      # pre-provisioned database, and here we want the Docker self-provisioning
      # path that needs no credentials.
      - name: Live integration tier
        working-directory: xchain-e2e-test
        run: >
          env -u HUB_DB_HOST -u HUB_DB_USER -u HUB_DB_PASS -u HUB_DB_NAME -u HUB_DB_PORT
          npm run ci:live

  # Cross-repo drift guards: this repo vendors the canonical
  # coin registry from xchain-hub, and per-repo CI cannot see sibling repos, so
  # a drifted vendored copy previously shipped green (the byte-identity checks
  # ran only in the monorepo's manual bin/ci-all.sh). This job recreates the
  # sibling layout (self + canonical side by side) and runs the same checks.
  # The canonical repo is private pre-launch, so its checkout uses a read-only
  # deploy key; drop the ssh-key line when the repos flip public at launch.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-e2e-test

      - name: Check out the canonical coin registry (xchain-hub)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Coin-registry byte-identity vs canonical
        run: xchain-hub/bin/sync-coins.sh --check --only xchain-e2e-test

      - name: Coin consensus-pin conformance (own vendored bundle)
        working-directory: xchain-e2e-test
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '
